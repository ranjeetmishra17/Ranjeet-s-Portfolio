<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <clipPath id="avatar-clip">
      <circle cx="100" cy="100" r="96" />
    </clipPath>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede5d8" />
      <stop offset="100%" stop-color="#ded4c4" />
    </linearGradient>
    <linearGradient id="hair-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242e15" />
      <stop offset="100%" stop-color="#18200d" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="98" fill="url(#avatar-bg)" stroke="#1c2311" stroke-width="3" />

  <g clip-path="url(#avatar-clip)">
    <!-- Shoulders / Torso in Deep Olive -->
    <path d="M40 210 C45 155 75 142 100 142 C125 142 155 155 160 210 Z" fill="#242f15" stroke="#1c2311" stroke-width="2.5" />
    <!-- Collar / Shirt Neckline -->
    <path d="M88 143 L100 162 L112 143" fill="#f5eee2" stroke="#1c2311" stroke-width="2.5" />

    <!-- Neck -->
    <path d="M86 115 L86 145 C95 148 105 148 114 145 L114 115 Z" fill="#e8dcce" stroke="#1c2311" stroke-width="2.5" />

    <!-- Head / Face Silhouette -->
    <path d="M70 82 C70 125 78 135 100 135 C122 135 130 125 130 82 C130 46 118 42 100 42 C82 42 70 46 70 82 Z" fill="#f4ebd9" stroke="#1c2311" stroke-width="3" />

    <!-- Ears -->
    <path d="M66 84 C64 80 64 94 69 94" fill="#f4ebd9" stroke="#1c2311" stroke-width="2.5" />
    <path d="M134 84 C136 80 136 94 131 94" fill="#f4ebd9" stroke="#1c2311" stroke-width="2.5" />

    <!-- Minimal Modern Glasses (Optional Creative Accent) -->
    <rect x="76" y="76" width="19" height="15" rx="4" fill="none" stroke="#1c2311" stroke-width="2.8" />
    <rect x="105" y="76" width="19" height="15" rx="4" fill="none" stroke="#1c2311" stroke-width="2.8" />
    <line x1="95" y1="83" x2="105" y2="83" stroke="#1c2311" stroke-width="2.8" />
    <line x1="70" y1="80" x2="76" y2="82" stroke="#1c2311" stroke-width="2.2" />
    <line x1="124" y1="82" x2="130" y2="80" stroke="#1c2311" stroke-width="2.2" />

    <!-- Eyes (Subtle focus lines behind glasses) -->
    <circle cx="85.5" cy="83.5" r="2.2" fill="#1c2311" />
    <circle cx="114.5" cy="83.5" r="2.2" fill="#1c2311" />

    <!-- Nose -->
    <path d="M99 87 L97 97 L102 97" fill="none" stroke="#1c2311" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Smile / Lips -->
    <path d="M93 108 Q100 114 107 108" fill="none" stroke="#1c2311" stroke-width="2.5" stroke-linecap="round" />

    <!-- Stylized Modern Hair (Textured crop) -->
    <path d="M68 76 C65 52 75 34 100 34 C122 34 133 48 132 72 C126 56 114 50 100 50 C86 50 74 60 68 76 Z" fill="url(#hair-grad)" stroke="#1c2311" stroke-width="2.5" />
    <!-- Hair Strands Front Bang -->
    <path d="M78 48 C85 40 94 44 96 52 C90 51 84 50 78 48 Z" fill="#323f1c" />
    <path d="M102 44 C112 40 120 48 122 56 C116 52 108 50 102 44 Z" fill="#323f1c" />
  </g>

  <!-- Lime Accent Badge on bottom-right of avatar border -->
  <circle cx="152" cy="152" r="14" fill="#c5db80" stroke="#1c2311" stroke-width="2.5" />
  <circle cx="152" cy="152" r="6" fill="#1c2311" />
</svg>

